kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rwml-34fa

networking:
  # Use non-overlapping Pod/Service CIDRs (10.244.0.0/16 is Kind's default)
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"

# Make kubelet/containerd use systemd cgroups (prevents the 10248/healthz timeout)
kubeadmConfigPatches:
- |
  kind: KubeletConfiguration
  apiVersion: kubelet.config.k8s.io/v1beta1
  cgroupDriver: systemd
  # Ensure kubelet uses the system root cgroup/slices rather than a nested kubelet slice
  # This avoids errors like missing paths: kubelet.slice/kubelet-kubepods.slice
  cgroupRoot: "/"
  kubeletCgroups: "/system.slice/kubelet.service"
  runtimeCgroups: "/system.slice/containerd.service"
  systemCgroups: "/system.slice"
- |
  kind: InitConfiguration
  nodeRegistration:
    kubeletExtraArgs:
      node-labels: "ingress-ready=true"

containerdConfigPatches:
- |
  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
    SystemdCgroup = true

nodes:
- role: control-plane
  image: kindest/node:v1.31.4
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  - containerPort: 31092
    hostPort: 9092
    listenAddress: "127.0.0.1"
    protocol: TCP
  - containerPort: 31234
    hostPort: 31234
    listenAddress: "127.0.0.1"
    protocol: TCP
  - containerPort: 31235
    hostPort: 31235
    listenAddress: "127.0.0.1"
    protocol: TCP
  - containerPort: 31236
    hostPort: 31236
    listenAddress: "127.0.0.1"
    protocol: TCP
